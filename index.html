<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduPI — Belajar • Faham • Amal</title>
<style>
:root{--bg:#fbfaf5;--sage:#9caf88;--forest:#244b3b;--gold:#b79a58;--beige:#eee8dc;--white:#fff;--muted:#66756d;--line:#e3e7df;--danger:#8b4b3e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#26332d;line-height:1.55}button,input,select,textarea{font:inherit}a{text-decoration:none;color:inherit}.wrap{max-width:1160px;margin:auto;padding:0 24px}.nav{position:sticky;top:0;z-index:30;background:rgba(251,250,245,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.navin{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-weight:850;font-size:26px;color:var(--forest)}.tag{font-size:10px;color:var(--gold);display:block;letter-spacing:.09em}.links{display:flex;gap:23px;font-size:14px;font-weight:700}.links a:hover{color:var(--forest)}.menu{display:none;background:none;border:0;font-size:25px}.hero{padding:78px 0 62px}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}.eyebrow{color:var(--forest);font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase}.hero h1{font-size:64px;line-height:1;margin:10px 0;color:var(--forest);letter-spacing:-3px}.hero h2{font-size:29px;margin:0 0 12px}.muted,.hero p{color:var(--muted)}.actions,.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:11px 17px;border-radius:12px;font-weight:750;border:1px solid var(--forest);transition:.18s;background:transparent;color:var(--forest)}.btn:hover{transform:translateY(-1px);background:#f3f6f0}.primary{background:var(--forest);color:#fff}.primary:hover{background:#1e4033}.gold{border-color:var(--gold);color:#6d5a2f}.visual{min-height:390px;border-radius:32px;background:linear-gradient(145deg,#e8eee4,#f3eee2);position:relative;border:1px solid #dde3d8;overflow:hidden}.arch{position:absolute;width:60%;height:78%;left:20%;top:12%;border:2px solid #ffffffaa;border-radius:150px 150px 28px 28px;background:#ffffff7a}.book{position:absolute;left:25%;bottom:21%;width:50%;height:90px;background:white;border-radius:16px;box-shadow:0 16px 30px #244b3b16;transform:rotate(-3deg)}.book:after{content:'';position:absolute;left:50%;top:10px;bottom:10px;border-left:1px solid #ddd}.tablet{position:absolute;right:17%;top:23%;width:130px;height:170px;border:9px solid var(--forest);border-radius:18px;background:#f8f6ed;transform:rotate(7deg)}.tablet:after{content:'بِسْمِ الله';position:absolute;inset:0;display:grid;place-items:center;color:var(--forest);font-family:serif;font-size:21px}.pencil{position:absolute;left:18%;top:28%;width:18px;height:155px;border-radius:8px;background:var(--gold);transform:rotate(-22deg)}.pattern{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(circle at 25px 25px,var(--forest) 2px,transparent 2px);background-size:50px 50px}.section{padding:68px 0}.soft{background:#f3f0e8}.head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:26px}.head h2{font-size:36px;margin:0;color:var(--forest);letter-spacing:-1px}.head p{margin:6px 0 0;color:var(--muted);max-width:700px}.grid4,.activities{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.years,.teacher-grid,.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.subjects{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 25px #294a3b10}.ico{width:42px;height:42px;border-radius:12px;background:#edf2e9;color:var(--forest);display:grid;place-items:center;font-size:19px;margin-bottom:15px}.card h3{margin:0 0 6px;color:#30453b}.card p{margin:0;color:var(--muted);font-size:14px}.year{display:flex;align-items:center;gap:16px;cursor:pointer}.num{width:54px;height:54px;flex:none;border-radius:16px;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800}.mini{margin-left:auto;color:var(--forest);font-weight:750;font-size:13px}.subject{text-align:center;cursor:pointer;padding:18px 9px}.subject .ico{margin:0 auto 9px}.pbd{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.panel{background:var(--forest);color:#fff;border-radius:24px;padding:32px}.panel p{color:#dfe9e3}.checks{background:#fff;border-radius:24px;padding:28px;border:1px solid var(--line)}.checks div{padding:9px 0;border-bottom:1px solid var(--line)}.practice{background:#ece8da;border:1px solid #dfd8c6;border-radius:24px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:22px}.tick{background:#fff;padding:13px 17px;border-radius:12px;border:1px solid #ded8ca}.searchbox{background:#fff;border:1px solid var(--line);padding:20px;border-radius:20px;margin-bottom:20px}.searchrow{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px}.field{width:100%;padding:12px 13px;border:1px solid #d8ded6;border-radius:11px;background:#fff}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.pill{font-size:11px;background:#eef2e9;color:var(--forest);padding:5px 8px;border-radius:999px}.pageHero{padding:48px 0 24px}.breadcrumbs{font-size:13px;color:var(--muted);margin-bottom:14px}.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.topic-card{cursor:pointer}.topic-card .btn{margin-top:15px}.lesson{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}.side{position:sticky;top:94px}.side button{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:9px;cursor:pointer;color:#40544a}.side button:hover{background:#edf2e9}.lessonbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;margin-bottom:16px}.lessonbox h3{color:var(--forest);margin-top:0}.exercise{padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.answer{margin-top:9px;padding:9px;border-radius:9px;background:#f4f1e8;display:none}.notice{padding:14px 16px;background:#fff8e7;border:1px solid #ead9aa;border-radius:12px;color:#66562f;font-size:13px}.modal{position:fixed;inset:0;background:#20372e88;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:25px}.close{float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.footer{padding:40px 0;border-top:1px solid var(--line);background:#f5f2ea}.foot{display:flex;justify-content:space-between;gap:30px}.footnav{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:900px){.links{display:none;position:absolute;top:72px;left:0;right:0;background:var(--bg);padding:18px 24px;border-bottom:1px solid var(--line);flex-direction:column}.links.open{display:flex}.menu{display:block}.hero-grid,.pbd,.lesson{grid-template-columns:1fr}.side{position:static}.grid4,.activities,.years,.teacher-grid,.resource-grid,.topic-grid{grid-template-columns:repeat(2,1fr)}.subjects{grid-template-columns:repeat(4,1fr)}.searchrow{grid-template-columns:1fr 1fr}.hero h1{font-size:52px}}@media(max-width:600px){.wrap{padding:0 16px}.hero{padding:50px 0}.hero h1{font-size:44px}.head{display:block}.head h2{font-size:30px}.grid4,.activities,.years,.teacher-grid,.resource-grid,.topic-grid,.searchrow,.formgrid{grid-template-columns:1fr}.subjects{grid-template-columns:repeat(2,1fr)}.practice,.foot{align-items:flex-start;flex-direction:column}.visual{min-height:290px}.section{padding:52px 0}.full{grid-column:auto}}
@media print{.nav,.footer,.no-print,.side{display:none!important}.lesson{display:block}.lessonbox{break-inside:avoid;border:1px solid #bbb}body{background:#fff}}
</style></head><body>
<header class="nav"><div class="wrap navin"><a href="#utama" class="brand" onclick="home()">EduPI<span class="tag">BELAJAR • FAHAM • AMAL</span></a><nav class="links" id="navlinks"><a href="#utama" onclick="home()">Utama</a><a href="#belajar" onclick="home()">Jom Belajar</a><a href="#aktiviti" onclick="home()">Aktiviti</a><a href="#pbd" onclick="home()">PBD</a><a href="#guru" onclick="home()">Ruang Guru</a></nav><button class="menu" onclick="navlinks.classList.toggle('open')" aria-label="Menu">☰</button></div></header>
<main id="main"></main>
<footer class="footer"><div class="wrap foot"><div><div class="brand">EduPI</div><div class="muted">Belajar • Faham • Amal</div><small class="muted">Platform Pembelajaran Digital Pendidikan Islam Sekolah Rendah</small></div><div class="footnav"><a href="#utama" onclick="home()">Utama</a><a href="#belajar" onclick="home()">Jom Belajar</a><a href="#aktiviti" onclick="home()">Aktiviti</a><a href="#pbd" onclick="home()">PBD</a><a href="#guru" onclick="home()">Ruang Guru</a></div></div></footer>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const fields=[['Al-Quran','▥'],['Hadis','❝'],['Akidah','◌'],['Ibadah','◇'],['Sirah','☾'],['Adab','❦'],['Jawi','✎']];
const themes={1:{'Al-Quran':'Bacaan al-Quran asas','Hadis':'Hadis dan amalan baik','Akidah':'Mengenal Allah dan iman','Ibadah':'Bersuci dan solat asas','Sirah':'Nabi Muhammad SAW teladan kita','Adab':'Adab diri dan keluarga','Jawi':'Huruf dan perkataan Jawi'},2:{'Al-Quran':'Bacaan dan hafazan pilihan','Hadis':'Menghayati hadis pilihan','Akidah':'Iman dan kebesaran Allah','Ibadah':'Solat dan kebersihan','Sirah':'Kehidupan Rasulullah SAW','Adab':'Adab belajar dan berkawan','Jawi':'Membaca dan menulis Jawi'},3:{'Al-Quran':'Bacaan, hafazan dan kefahaman','Hadis':'Hadis sebagai panduan','Akidah':'Rukun iman dalam kehidupan','Ibadah':'Ibadah harian','Sirah':'Peristiwa dalam sirah Rasulullah','Adab':'Adab sosial seorang Muslim','Jawi':'Ejaan dan tulisan Jawi'},4:{'Al-Quran':'Tilawah, hafazan dan kefahaman','Hadis':'Penghayatan hadis','Akidah':'Pegangan akidah yang benar','Ibadah':'Ibadah dengan tertib','Sirah':'Iktibar perjuangan Rasulullah','Adab':'Adab beriadah dan bermasyarakat','Jawi':'Perkataan pinjaman bahasa Arab'},5:{'Al-Quran':'Al-Quran panduan kehidupan','Hadis':'Hadis dan pembentukan akhlak','Akidah':'Memelihara akidah daripada syirik','Ibadah':'Ibadah dan tanggungjawab Muslim','Sirah':'Tokoh dan peristiwa sirah','Adab':'Adab dalam kehidupan','Jawi':'Kemahiran Jawi lanjutan'},6:{'Al-Quran':'Tilawah, hafazan dan kefahaman ayat pilihan','Hadis':'Hadis dan aplikasi kehidupan','Akidah':'Keimanan dan tanggungjawab','Ibadah':'Ibadah dan kehidupan bermasyarakat','Sirah':'Sirah sebagai panduan kepimpinan','Adab':'Adab dan akhlak terpuji','Jawi':'Pengukuhan pembacaan dan penulisan Jawi'}};
const resources=[
{name:'Lembaran Kerja Padanan',type:'Lembaran Kerja',field:'Akidah',year:'5',topic:'Syirik',desc:'Padankan situasi dengan tindakan yang menjaga akidah.'},
{name:'Kad Situasi Adab',type:'BBM Digital',field:'Adab',year:'4',topic:'Adab beriadah',desc:'Kad situasi untuk perbincangan dan pertimbangan murid.'},
{name:'PBD Akidah — Soalan Situasi',type:'PBD',field:'Akidah',year:'5',topic:'Syirik',desc:'Evidens sokongan melalui respons lisan/bertulis murid.'},
{name:'RPH Ringkas Jawi',type:'RPH',field:'Jawi',year:'4',topic:'Perkataan pinjaman bahasa Arab',desc:'Cadangan aliran PdP ringkas dan aktiviti bacaan.'},
{name:'Latihan Jawi Tahun 4',type:'Lembaran Kerja',field:'Jawi',year:'4',topic:'Perkataan pinjaman bahasa Arab',desc:'Latihan membaca dan mengenal perkataan pinjaman.'},
{name:'Aktiviti Susun Urutan',type:'Aktiviti Interaktif',field:'Ibadah',year:'3',topic:'Ibadah harian',desc:'Susun langkah amalan mengikut urutan yang betul.'}
];
let userResources=JSON.parse(localStorage.getItem('edupi_resources')||'[]');
function home(){main.innerHTML=`<section class="hero" id="utama"><div class="wrap hero-grid"><div><div class="eyebrow">Platform Pembelajaran Digital</div><h1>EduPI</h1><h2>Belajar Pendidikan Islam, lebih interaktif.</h2><p>Terokai ilmu dan amalkan dalam kehidupan. Pembelajaran tersusun untuk murid Tahun 1 hingga Tahun 6.</p><div class="actions"><a class="btn primary" href="#belajar">Mula Belajar</a><a class="btn" href="#guru">Ruang Guru</a></div></div><div class="visual"><div class="pattern"></div><div class="arch"></div><div class="book"></div><div class="tablet"></div><div class="pencil"></div></div></div></section>
<section class="section"><div class="wrap"><div class="head"><div><h2>Akses Pantas</h2><p>Ilmu, aktiviti, pentaksiran dan amalan harian dalam satu ruang.</p></div></div><div class="grid4"><a class="card" href="#belajar"><div class="ico">▤</div><h3>Jom Belajar</h3><p>Belajar mengikut tahun dan bidang.</p></a><a class="card" href="#aktiviti"><div class="ico">◫</div><h3>Aktiviti</h3><p>Latihan dan aktiviti interaktif.</p></a><a class="card" href="#pbd"><div class="ico">✓</div><h3>PBD</h3><p>Sokongan evidens pembelajaran.</p></a><a class="card" href="#amalan"><div class="ico">☾</div><h3>Amalan Harian</h3><p>Hubungkan ilmu dengan kehidupan.</p></a></div></div></section>
<section class="section soft" id="belajar"><div class="wrap"><div class="head"><div><h2>Pilih Tahun Anda</h2><p>Setiap tahun mengandungi tujuh bidang Pendidikan Islam.</p></div></div><div class="years">${[1,2,3,4,5,6].map(y=>`<div class="card year" onclick="openYear(${y})"><div class="num">${y}</div><div><h3>Tahun ${y}</h3><p>Nota, aktiviti dan latihan.</p></div><span class="mini">Teroka →</span></div>`).join('')}</div></div></section>
<section class="section"><div class="wrap"><div class="head"><div><h2>Bidang Pembelajaran</h2><p>Al-Quran, Hadis, Akidah, Ibadah, Sirah, Adab dan Jawi.</p></div></div><div class="subjects">${fields.map(f=>`<div class="card subject" onclick="openField('${f[0]}')"><div class="ico">${f[1]}</div><h3>${f[0]}</h3></div>`).join('')}</div></div></section>
<section class="section soft" id="aktiviti"><div class="wrap"><div class="head"><div><h2>Belajar Sambil Berfikir</h2><p>Aktiviti daripada aras asas hingga KBAT tanpa sistem mata atau lencana.</p></div></div><div class="activities">${['Kuiz','Padanan','Susun Jawapan','Benar atau Salah','Kad Situasi','Soalan KBAT','Exit Ticket'].map((a,i)=>`<div class="card"><div class="ico">${i+1}</div><h3>${a}</h3><p>Aktiviti latihan yang boleh digunakan terus.</p><button class="btn" onclick="activity('${a}')">Mula Aktiviti</button></div>`).join('')}</div></div></section>
<section class="section" id="pbd"><div class="wrap pbd"><div class="panel"><h2>Sokongan PBD</h2><p>EduPI membantu guru menyediakan latihan, kuiz, soalan situasi, pemerhatian, pemulihan, pengayaan dan evidens pembelajaran.</p><button class="btn" style="background:#fff" onclick="teacher('PBD')">Teroka Aktiviti PBD</button><p><small>EduPI ialah platform sokongan dan tidak menggantikan sistem PBD rasmi sekolah.</small></p></div><div class="checks">${['Latihan','Kuiz','Soalan situasi','Pemerhatian','Pemulihan','Pengayaan','Evidens pembelajaran'].map(x=>`<div>✓ ${x}</div>`).join('')}</div></div></section>
<section class="section soft" id="amalan"><div class="wrap"><div class="practice"><div><div class="eyebrow">Amalan Harian</div><h3>Memberikan salam kepada guru dan rakan apabila bertemu.</h3><p class="muted">Ilmu menjadi lebih bermakna apabila diamalkan.</p></div><label class="tick"><input type="checkbox"> Saya telah melakukannya</label></div></div></section>
<section class="section" id="guru"><div class="wrap"><div class="head"><div><h2>Ruang Guru</h2><p>Pusat carian bahan PdP, RPH, PBD, BBM digital dan lembaran kerja.</p></div><button class="btn primary" onclick="addMaterial()">+ Tambah Bahan</button></div>${teacherSearch()}<div class="teacher-grid">${['Bahan PdP','RPH','PBD','BBM Digital','Lembaran Kerja','Aktiviti Interaktif'].map(x=>`<div class="card" onclick="teacher('${x}')"><div class="ico">▤</div><h3>${x}</h3><p>Buka koleksi ${x.toLowerCase()}.</p></div>`).join('')}</div></div></section>`;setTimeout(()=>{if(location.hash)document.querySelector(location.hash)?.scrollIntoView()},0)}
function teacherSearch(){return `<div class="searchbox"><div class="searchrow"><input id="q" class="field" placeholder="Cari bahan PdP, topik, tahun atau bidang..." oninput="searchResources()"><select id="fy" class="field" onchange="searchResources()"><option value="">Semua Tahun</option>${[1,2,3,4,5,6].map(x=>`<option>${x}</option>`).join('')}</select><select id="ff" class="field" onchange="searchResources()"><option value="">Semua Bidang</option>${fields.map(x=>`<option>${x[0]}</option>`).join('')}</select><select id="ft" class="field" onchange="searchResources()"><option value="">Semua Jenis Bahan</option>${['Bahan PdP','RPH','PBD','BBM Digital','Lembaran Kerja','Aktiviti Interaktif'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="results"></div></div>`}
function openYear(y){main.innerHTML=`<section class="pageHero"><div class="wrap"><div class="breadcrumbs"><a onclick="home()">Utama</a> / Jom Belajar / Tahun ${y}</div><div class="head"><div><div class="eyebrow">Jom Belajar</div><h2>Pendidikan Islam Tahun ${y}</h2><p>Pilih bidang untuk membuka topik, nota, aktiviti dan latihan.</p></div><button class="btn" onclick="home()">← Kembali</button></div><div class="subjects">${fields.map(f=>`<div class="card subject" onclick="openTopic(${y},'${f[0]}')"><div class="ico">${f[1]}</div><h3>${f[0]}</h3></div>`).join('')}</div></div></section><section class="section soft"><div class="wrap"><div class="notice"><b>Rujukan kurikulum:</b> Struktur EduPI mengikuti tujuh bidang utama KSSR Pendidikan Islam. Kod SK/SP khusus hanya dipaparkan apabila telah disahkan daripada sumber DSKP; kandungan ringkas diolah sebagai bahan digital dan bukan salinan buku teks.</div></div></section>`;scrollTo(0,0)}
function openField(f){main.innerHTML=`<section class="pageHero"><div class="wrap"><div class="breadcrumbs">Utama / Bidang / ${f}</div><div class="head"><div><h2>${f}</h2><p>Pilih tahun untuk meneroka pembelajaran ${f}.</p></div><button class="btn" onclick="home()">← Kembali</button></div><div class="years">${[1,2,3,4,5,6].map(y=>`<div class="card year" onclick="openTopic(${y},'${f}')"><div class="num">${y}</div><div><h3>Tahun ${y}</h3><p>${themes[y][f]}</p></div></div>`).join('')}</div></div></section>`;scrollTo(0,0)}
function curriculumMeta(y,f){if(y==4&&f=='Adab')return {sk:'6.2 Merumus adab beriadah yang menepati syarak dan mengamalkannya secara beradab dan istiqamah.',sp:'6.2.3 Menjelaskan adab beriadah yang menepati syarak; 6.2.5 Menganalisis kepentingannya.'};if(y==4&&f=='Jawi')return {sk:'7.4 Mengenal, membaca dan menulis perkataan pinjaman bahasa Arab dengan betul secara beradab dan istiqamah.',sp:'7.4.2 Membaca perkataan pinjaman bahasa Arab dengan betul.'};return {sk:'Rujuk DSKP KSSR Pendidikan Islam Tahun '+y+' bagi bidang '+f+'.',sp:'Kod Standard Pembelajaran khusus perlu disahkan pada DSKP sebelum digunakan dalam dokumen rasmi.'}}
function openTopic(y,f){let m=curriculumMeta(y,f),title=themes[y][f];main.innerHTML=`<section class="pageHero"><div class="wrap"><div class="breadcrumbs">Utama / Tahun ${y} / ${f}</div><div class="head"><div><div class="eyebrow">${f} • Tahun ${y}</div><h2>${title}</h2><p>Nota digital ringkas dengan aktiviti dan latihan pelbagai aras.</p></div><button class="btn" onclick="openYear(${y})">← Bidang</button></div></div></section><section class="section soft"><div class="wrap lesson"><aside class="card side no-print"><b>Dalam topik</b><button onclick="go('meta')">Maklumat Kurikulum</button><button onclick="go('obj')">Objektif</button><button onclick="go('nota')">Nota</button><button onclick="go('aktivitiTopik')">Aktiviti</button><button onclick="go('latihan')">Latihan</button><button onclick="go('bahan')">Bahan PdP</button></aside><div><div class="lessonbox" id="meta"><h3>Maklumat Kurikulum</h3><div class="meta"><span class="pill">Tahun ${y}</span><span class="pill">${f}</span><span class="pill">Nota + Aktiviti + Latihan</span></div><p><b>Tajuk:</b> ${title}</p><p><b>Standard Kandungan:</b> ${m.sk}</p><p><b>Standard Pembelajaran:</b> ${m.sp}</p></div><div class="lessonbox" id="obj"><h3>Objektif Pembelajaran</h3><ul><li>Menyatakan sekurang-kurangnya dua idea penting berkaitan ${title.toLowerCase()}.</li><li>Menjelaskan contoh yang sesuai dalam kehidupan harian.</li><li>Mengaplikasikan pembelajaran melalui satu situasi mudah.</li></ul></div><div class="lessonbox" id="nota"><h3>Nota Mudah</h3><p><b>Apa yang kita pelajari?</b> Dalam bidang ${f}, murid belajar memahami ilmu dengan betul, menghubungkannya dengan contoh harian dan membina amalan yang baik.</p><p><b>Ingat:</b> Fahami maksud, kenal pasti contoh, kemudian fikir bagaimana ilmu itu boleh diamalkan dalam kehidupan.</p><div class="notice">Nota ini ialah olahan digital ringkas. Untuk pengajaran rasmi, guru perlu menyemak teks SK/SP dan kandungan terperinci dalam DSKP serta buku teks KSSR yang digunakan sekolah.</div></div><div class="lessonbox" id="aktivitiTopik"><h3>Aktiviti</h3><p><b>Fikir–Pilih–Jelaskan:</b> Guru paparkan tiga situasi. Murid memilih situasi yang paling menepati pembelajaran dan menerangkan sebab pilihan.</p><button class="btn" onclick="activity('Kad Situasi')">Mula Kad Situasi</button></div><div class="lessonbox" id="latihan"><h3>Latihan Menguji Minda</h3>${exerciseSet(f,title)}</div><div class="lessonbox" id="bahan"><h3>Bahan PdP</h3><div class="resource-grid">${['Lembaran kerja','Kad aktiviti','Aktiviti padanan','Soalan KBAT','Pemulihan','Pengayaan'].map(x=>`<div class="card"><h3>${x}</h3><p>Template boleh digunakan dan diubah suai oleh guru.</p><div class="toolbar"><button class="btn" onclick="previewTemplate('${x}','${f}',${y})">Lihat</button><button class="btn" onclick="previewTemplate('${x}','${f}',${y})">Mula</button><button class="btn" onclick="window.print()">Cetak</button><button class="btn" onclick="downloadTemplate('${x}','${f}',${y})">Muat Turun</button></div></div>`).join('')}</div></div></div></div></section>`;scrollTo(0,0)}
function exerciseSet(f,t){let qs=[['Aras asas','Benar atau Salah: Ilmu yang dipelajari perlu difahami dan diamalkan dalam kehidupan.','Benar.'],['Aras sederhana','Kelaskan dua contoh tindakan: satu yang sesuai dengan pembelajaran dan satu yang perlu diperbaiki.','Bincangkan alasan berdasarkan nilai dan prinsip topik.'],['KBAT',`Seorang murid berdepan situasi yang berkaitan dengan ${t.toLowerCase()}. Apakah tindakan yang patut dipilih? Jelaskan sebab.`,`Jawapan dinilai berdasarkan ketepatan tindakan, alasan dan kaitan dengan ${f}.`]];return qs.map((q,i)=>`<div class="exercise"><b>${q[0]}</b><p>${q[1]}</p><button class="btn" onclick="this.nextElementSibling.style.display='block'">Semak panduan</button><div class="answer">${q[2]}</div></div>`).join('')}
function activity(name){modal.classList.add('open');modalbox.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${name}</h2><p class="muted">Aktiviti interaktif ringkas EduPI.</p><div class="exercise"><b>Situasi:</b><p>Anda melihat rakan melakukan sesuatu yang kurang sesuai. Apakah tindakan yang paling baik?</p><label><input type="radio" name="a"> Menegur dengan sopan dan menerangkan sebab.</label><br><label><input type="radio" name="a"> Membiarkannya tanpa berbuat apa-apa.</label><br><br><button class="btn primary" onclick="document.getElementById('feedback').innerHTML='Bandingkan pilihan anda dengan nilai yang dipelajari. Jelaskan sebab pilihan anda kepada guru atau rakan.'">Semak</button><div id="feedback" class="answer" style="display:block"></div></div>`}
function previewTemplate(name,f,y){modal.classList.add('open');modalbox.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${name}</h2><p><b>Tahun:</b> ${y} &nbsp; <b>Bidang:</b> ${f}</p><hr><p>Nama: ____________________ &nbsp; Tarikh: __________</p><h3>Arahan</h3><p>Baca setiap situasi. Tulis atau bincangkan jawapan anda dengan alasan yang jelas.</p><ol><li>Nyatakan perkara utama yang anda fahami.</li><li>Berikan satu contoh dalam kehidupan.</li><li>Apakah tindakan yang wajar? Mengapa?</li></ol><button class="btn" onclick="window.print()">Cetak</button>`}
function downloadTemplate(name,f,y){let text=`EduPI - ${name}\nTahun: ${y}\nBidang: ${f}\n\nNama: ____________________\nTarikh: ___________________\n\n1. Nyatakan perkara utama yang anda fahami.\n2. Berikan satu contoh dalam kehidupan.\n3. Apakah tindakan yang wajar? Jelaskan sebab.`;let b=new Blob([text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`EduPI_${name.replaceAll(' ','_')}_T${y}_${f}.txt`;a.click();URL.revokeObjectURL(a.href)}
function teacher(type=''){main.innerHTML=`<section class="pageHero"><div class="wrap"><div class="head"><div><div class="eyebrow">Dashboard Guru</div><h2>Ruang Guru</h2><p>Cari, buka, cetak dan urus bahan sokongan PdP.</p></div><div class="actions"><button class="btn" onclick="home()">← Utama</button><button class="btn primary" onclick="addMaterial()">+ Tambah Bahan</button></div></div>${teacherSearch()}<div id="library"></div><div class="notice" style="margin-top:20px"><b>Tentang simpanan:</b> Versi ini ialah website frontend. Metadata bahan yang ditambah disimpan pada <i>localStorage</i> pelayar ini sahaja. Fail tempatan tidak dimuat naik atau disimpan secara kekal. Penyimpanan fail sebenar merentas peranti memerlukan backend/database/file storage seperti Firebase, Supabase atau storan pelayan.</div></div></section>`;setTimeout(()=>{if(type){ft.value=type}searchResources()},0);scrollTo(0,0)}
function searchResources(){let all=[...resources,...userResources],q=(document.getElementById('q')?.value||'').toLowerCase(),y=document.getElementById('fy')?.value||'',f=document.getElementById('ff')?.value||'',t=document.getElementById('ft')?.value||'';let out=all.filter(r=>(!q||Object.values(r).join(' ').toLowerCase().includes(q))&&(!y||r.year==y)&&(!f||r.field==f)&&(!t||r.type==t));let el=document.getElementById('results')||document.getElementById('library');if(document.getElementById('results')) document.getElementById('results').innerHTML=out.length?`<div class="resource-grid" style="margin-top:18px">${out.map(resourceCard).join('')}</div>`:`<div class="empty">Tiada bahan sepadan.</div>`;if(document.getElementById('library'))document.getElementById('library').innerHTML=out.length?`<div class="resource-grid">${out.map(resourceCard).join('')}</div>`:`<div class="empty">Tiada bahan sepadan.</div>`}
function resourceCard(r){return `<div class="card"><div class="meta"><span class="pill">Tahun ${r.year}</span><span class="pill">${r.field}</span><span class="pill">${r.type}</span></div><h3>${r.name}</h3><p><b>${r.topic}</b><br>${r.desc}</p><div class="toolbar"><button class="btn" onclick='viewResource(${JSON.stringify(JSON.stringify(r))})'>Buka</button><button class="btn" onclick='downloadResource(${JSON.stringify(JSON.stringify(r))})'>Muat turun</button></div></div>`}
function viewResource(s){let r=JSON.parse(s);modal.classList.add('open');modalbox.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${r.name}</h2><div class="meta"><span class="pill">Tahun ${r.year}</span><span class="pill">${r.field}</span><span class="pill">${r.type}</span></div><p><b>Topik:</b> ${r.topic}</p><p>${r.desc}</p>${r.link?`<p><a class="btn primary" href="${r.link}" target="_blank" rel="noopener">Buka Pautan</a></p>`:''}<button class="btn" onclick="window.print()">Cetak</button>`}
function downloadResource(s){let r=JSON.parse(s),b=new Blob([`EduPI\n${r.name}\nTahun ${r.year} | ${r.field} | ${r.type}\nTopik: ${r.topic}\n\n${r.desc}\n${r.link||''}`],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=r.name.replaceAll(' ','_')+'.txt';a.click();URL.revokeObjectURL(a.href)}
function addMaterial(){modal.classList.add('open');modalbox.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>+ Tambah Bahan</h2><div class="notice">Metadata dan pautan boleh disimpan pada pelayar ini. Fail yang dipilih tidak akan dimuat naik kerana versi frontend ini tiada backend/file storage.</div><form class="formgrid" onsubmit="saveMaterial(event)"><label>Nama bahan<input required class="field" name="name"></label><label>Tahun<select required class="field" name="year"><option></option>${[1,2,3,4,5,6].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Bidang<select required class="field" name="field">${fields.map(x=>`<option>${x[0]}</option>`).join('')}</select></label><label>Topik<input required class="field" name="topic"></label><label>Jenis bahan<select class="field" name="type">${['Bahan PdP','RPH','PBD','BBM Digital','Lembaran Kerja','Aktiviti Interaktif'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Fail tempatan<input class="field" type="file" name="file"></label><label class="full">Penerangan<textarea required class="field" name="desc" rows="3"></textarea></label><label class="full">Pautan (jika ada)<input class="field" type="url" name="link" placeholder="https://..."></label><button class="btn primary full">Simpan Metadata Bahan</button></form>`}
function saveMaterial(e){e.preventDefault();let f=new FormData(e.target),r={name:f.get('name'),year:f.get('year'),field:f.get('field'),topic:f.get('topic'),type:f.get('type'),desc:f.get('desc'),link:f.get('link'),localFileName:f.get('file')?.name||''};userResources.push(r);localStorage.setItem('edupi_resources',JSON.stringify(userResources));closeModal();teacher()}
function closeModal(){modal.classList.remove('open')}function go(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth'})}
home();
</script></body></html>
